name: Build & Push Patched Elasticsearch Image

on:
  push:
    branches: [ fix/cve-7.17.28 ]
  workflow_dispatch:

jobs:
  build-docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push patched image
        env:
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          docker build \
            -t "ghcr.io/${REPO_OWNER}/elasticsearch:7.17.28-patched" \
            -t "ghcr.io/${REPO_OWNER}/elasticsearch:latest" \
            -f Dockerfile .
          docker push "ghcr.io/${REPO_OWNER}/elasticsearch:7.17.28-patched"
          docker push "ghcr.io/${REPO_OWNER}/elasticsearch:latest"
